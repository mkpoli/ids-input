name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build:demo
      # A preview version is not the page to index.
      - if: github.ref != 'refs/heads/main'
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A fork's pull request cannot read this repository's secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - id: alias
        run: |
          alias=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9-]/-/g' | cut -c1-40)
          echo "name=$alias" >> "$GITHUB_OUTPUT"
      - id: ship
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || format('versions upload --preview-alias {0}', steps.alias.outputs.name) }}
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="${{ steps.ship.outputs.deployment-url }}"
          [ -n "$url" ] || url="https://${{ steps.alias.outputs.name }}-ids-input-workshop.mkpoli.workers.dev"
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body "Preview: $url"
