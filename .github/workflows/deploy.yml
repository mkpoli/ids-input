# Publish ids.mkpo.li from main as a Worker with the built workshop as its assets. The worker
# answers share links (`/s/<sequence>`) and their preview cards (`/og/<sequence>.png`) itself and
# hands every other path to the assets, so the deployment carries both.
#
# One repository secret is required: CLOUDFLARE_API_TOKEN, the "Edit Cloudflare Workers" template
# over the account in wrangler.jsonc and the mkpo.li zone. The zone's DNS permission is what lets
# wrangler hold the ids.mkpo.li custom domain.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy credential is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unset; add it under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: astral-sh/setup-uv@v6

      - run: bun install --frozen-lockfile
      - run: bun run verify

      # The workshop, then the faces and tables the cards are drawn with (scripts/og-assets.mjs).
      - run: bun run build:site

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy

      - name: Confirm the site and a card answer
        run: |
          for path in / /s/%E2%BF%B0%E9%87%92%E5%93%A5 /og/%E2%BF%B0%E9%87%92%E5%93%A5.png; do
            echo "$(curl -fsS -o /dev/null -w '%{http_code} %{content_type}' "https://ids.mkpo.li$path") $path"
          done
