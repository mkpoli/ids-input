name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A deploy runs to the end; a second push to a preview cancels the one it supersedes.
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run build:site
      - run: node tests/worker-og-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Merged main becomes the site; a branch of this repository answers at a preview alias. A fork's
    # pull request cannot read this repository's secrets, which gate the steps below.
    if: |
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - id: creds
        env:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$token" ] && [ -n "$account" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - id: name
        if: github.ref != 'refs/heads/main'
        env:
          number: ${{ github.event.number }}
          branch: ${{ github.ref_name }}
        run: |
          if [ -n "$number" ]; then echo "preview=pr-${number}" >> "$GITHUB_OUTPUT"
          else
            slug=$(printf %s "$branch" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9\n' '-' | sed 's/-\+/-/g; s/^-//' | cut -c1-40 | sed 's/-$//')
            [ -n "$slug" ] || slug="branch-$(echo "$GITHUB_SHA" | cut -c1-7)"
            echo "preview=${slug}" >> "$GITHUB_OUTPUT"
          fi
      - id: ship
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          packageManager: bun
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || format('versions upload --preview-alias {0}', steps.name.outputs.preview) }}
      - if: github.event_name == 'pull_request' && steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          alias: ${{ steps.name.outputs.preview }}
          number: ${{ github.event.number }}
        run: |
          url="https://${alias}-ids-input-workshop.mkpoli.workers.dev"
          gh pr comment "$number" --edit-last --create-if-none --body "Preview: ${url}"
