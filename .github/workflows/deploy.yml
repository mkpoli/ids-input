name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A deploy runs to the end; a newer dispatch of the same branch waits.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/composer
      - run: bun install --frozen-lockfile
      - run: bun run build:site
      - run: node tests/worker-og-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Merged main becomes the site; credentials gate the upload below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - id: creds
        env:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$token" ] && [ -n "$account" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - id: ship
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          packageManager: bun
          command: deploy
