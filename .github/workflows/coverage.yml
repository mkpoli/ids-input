name: Coverage
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: coverage
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The rendered exports move rarely; the shards they hand out are what the audit caches.
      - uses: actions/cache@v4
        with:
          path: cache
          key: coverage-shards-${{ hashFiles('demo/lib/composer.js') }}
          restore-keys: coverage-shards-
      - run: bun install --frozen-lockfile
      - run: bun run coverage
      - name: Open a pull request when a report moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/coverage
          if git diff --cached --quiet; then
            echo 'The reports already describe this tree.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C chore/coverage-refresh
          git commit -m 'chore(coverage): re-render the reports'
          git push --force origin chore/coverage-refresh
          gh pr create --base main --head chore/coverage-refresh \
            --title 'chore(coverage): re-render the reports' \
            --body 'Rendered from the current tree by the scheduled coverage job. Merging states what the preview draws at this commit; the figures change only where the exports did.' \
            || echo 'A refresh pull request is already open.'
