name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v10.3.3
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # The workshop's browser checks drive the demo through Chromium, so a broken check or a changed
  # selector fails here rather than on `main`. `check-gongche` takes six minutes and stays out.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v10.3.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run check:demo -- --skip gongche
