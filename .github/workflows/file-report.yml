name: File report
# The endpoint hands each report to this action, so the issue is opened by the workshop's own bot
# and the report names the reporter. Dispatch comes from the intake Worker; the answer goes back
# through it, to the dialog that is waiting.
on:
  repository_dispatch:
    types: [report]
permissions:
  contents: write
  issues: write
jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The run commits the drawing to bug-attachments with this checkout's token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: bunx playwright-core install --with-deps chromium
      # The report rides in the payload as base64; this files the issue and leaves the drawing in
      # .cache/report for the step below, which names the address the body points at.
      - name: File the report
        run: bun workers/reports/intake/run.js
      # The drawing is taken from the site, so it waits in .cache/ and goes in after the browser is done.
      - name: Commit the drawing
        if: hashFiles('.cache/report/attachment') != ''
        run: bun workers/reports/intake/attach.js
