<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>IDS Workshop — Ideographic Description Sequence Editor</title>
  <meta name="description" content="Build and edit ideographic description sequences (IDS), find Han characters by their parts, preview Han and Tangut forms, and export SVG or PNG images.">
  <link rel="canonical" href="https://ids.mkpo.li/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IDS Workshop">
  <meta property="og:title" content="IDS Workshop — Ideographic Description Sequence Editor">
  <meta property="og:description" content="Build and edit ideographic description sequences (IDS), find Han characters by their parts, preview Han and Tangut forms, and export SVG or PNG images.">
  <meta property="og:url" content="https://ids.mkpo.li/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="IDS Workshop — Ideographic Description Sequence Editor">
  <meta name="twitter:description" content="Build and edit ideographic description sequences (IDS), find Han characters by their parts, preview Han and Tangut forms, and export SVG or PNG images.">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "@id": "https://ids.mkpo.li/#application",
      "name": "IDS Workshop",
      "url": "https://ids.mkpo.li/",
      "description": "Build and edit ideographic description sequences (IDS), find Han characters by their parts, preview Han and Tangut forms, and export SVG or PNG images.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript and a modern web browser",
      "inLanguage": ["en", "ja", "zh-Hans", "zh-Hant", "ko", "vi"],
      "isAccessibleForFree": true,
      "license": "https://github.com/mkpoli/ids-input/blob/main/LICENSE"
    }
  </script>
  <script>
    // The theme kept from the last visit, set before the page paints.
    try { const theme = JSON.parse(localStorage.getItem('ids-input:theme') ?? 'null'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}
    // The glyph face kept from the last visit, set before the page paints.
    try { const face = JSON.parse(localStorage.getItem('ids-input:font') ?? '"sans"'); if (face === 'serif' || face === 'klee') document.documentElement.dataset.font = face } catch {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <main>
      <h1>IDS Workshop</h1>
      <p>Build and edit ideographic description sequences (IDS), find Han characters by their parts,
        preview Han and Tangut forms, and export SVG or PNG images.</p>
      <p>Enable JavaScript to use the editor. Read the
        <a href="https://github.com/mkpoli/ids-input#readme">documentation and examples</a>
        for instructions.</p>
    </main>
  </noscript>
  <script type="module" src="./main.js"></script>
</body>
</html>
