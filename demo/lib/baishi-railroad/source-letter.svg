	svg.railroad-diagram path {
		stroke-width:3;
		stroke:black;
		fill:rgba(0,0,0,0);
	}
	svg.railroad-diagram text {
		font:bold 14px monospace;
		text-anchor:middle;
	}
	svg.railroad-diagram text.label{
		text-anchor:start;
	}
	svg.railroad-diagram text.comment{
		font:italic 12px monospace;
	}
	svg.railroad-diagram rect{
		stroke-width:3;
		stroke:black;
		fill:hsl(120,100%,90%);
	}
	svg.railroad-diagram rect.group-box {
		stroke: gray;
		stroke-dasharray: 10 5;
		fill: none;
	}

svg.railroad-diagram { background: #ffffff; }
svg.railroad-diagram text { font-family: "Noto Sans Mono CJK SC", "Noto Sans CJK SC", "DengXian", monospace; }
svg.railroad-diagram g.non-terminal.special rect { fill: #eef3e6; stroke-dasharray: 4 3; }
svg.railroad-diagram text.rule-title { font-size: 15px; font-weight: bold; text-anchor: start; }
svg.railroad-diagram a text { fill: #1a4f8a; }
@media (prefers-color-scheme: dark) {
  svg.railroad-diagram { background: #16181c; }
  svg.railroad-diagram path { stroke: #c8ccd2; }
  svg.railroad-diagram rect { stroke: #c8ccd2; fill: #23272e; }
  svg.railroad-diagram g.non-terminal.special rect { fill: #233021; }
  svg.railroad-diagram text { fill: #e6e8eb; }
  svg.railroad-diagram a text { fill: #8cc4ff; }
}

