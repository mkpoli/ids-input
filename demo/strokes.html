<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Stroke orders — IDS Workshop</title>
  <meta name="description" content="Enter the stroke order of the components no source records, so the characters written with them can be given an order.">
  <link rel="canonical" href="https://ids.mkpo.li/strokes">
  <meta name="robots" content="noindex">
  <script>
    try { const theme = JSON.parse(localStorage.getItem('ids-input:theme') ?? 'null'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}
  </script>
</head>
<body>
  <div id="strokes"></div>
  <noscript>
    <main>
      <h1>Stroke orders</h1>
      <p><a href="/data/open-strokes/wanted.tsv">wanted.tsv</a> · <a href="/data/open-strokes/entered.tsv">entered.tsv</a> · <a href="/data/open-strokes/README.md">README</a></p>
    </main>
  </noscript>
  <script type="module" src="./strokes.js"></script>
</body>
</html>
