<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Sources — IDS Workshop</title>
  <meta name="description" content="Every source the IDS Workshop reads or cites: data, fonts, code, references and prior work, with the records behind its examples.">
  <link rel="canonical" href="https://ids.mkpo.li/sources">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IDS Workshop">
  <meta property="og:title" content="Sources — IDS Workshop">

  <meta property="og:url" content="https://ids.mkpo.li/sources">
  <meta name="twitter:card" content="summary">
  <script>
    try { const theme = JSON.parse(localStorage.getItem('ids-input:theme') ?? 'null'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}
  </script>
</head>
<body>
  <div id="sources"></div>
  <noscript>
    <main>
      <h1>Sources</h1>
      <p>Every source the IDS Workshop reads or cites, with licences, dates and tags.</p>
      <p>Enable JavaScript to see the catalogue. The <a href="./">workshop</a> needs it too.</p>
    </main>
  </noscript>
  <script type="module" src="./sources.js"></script>
</body>
</html>
