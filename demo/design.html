<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>IDS UI — the workshop's design system</title>
  <meta name="description" content="The colours, type, states and form controls behind the IDS Workshop, with live contrast and keyboard checks.">
  <script>
    // The theme kept from the last visit, set before the page paints.
    try { const theme = JSON.parse(localStorage.getItem('ids-input:theme') ?? 'null'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}
  </script>
</head>
<body>
  <div id="design"></div>
  <script type="module" src="./design.js"></script>
</body>
</html>
