<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>IDS Workshop — Font mixer</title>
  <meta name="description" content="Blend a character between the workshop's five faces (Sans, Serif, Fangsong, Regular and Pen) and play the blend as a tour.">
  <link rel="canonical" href="https://ids.mkpo.li/font-mixer">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IDS Workshop">
  <meta property="og:title" content="IDS Workshop — Font mixer">
  <meta property="og:description" content="Blend a character between five faces.">
  <meta property="og:url" content="https://ids.mkpo.li/font-mixer.html">
  <meta name="twitter:card" content="summary">
  <script>
    // The theme kept from the last visit, set before the page paints.
    try { const theme = JSON.parse(localStorage.getItem('ids-input:theme') ?? 'null'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme } catch {}
  </script>
</head>
<body>
  <div id="font-mixer"></div>
  <noscript>
    <main>
      <h1>IDS Workshop — Font mixer</h1>
      <p>A character drawn in any blend of the workshop's five faces.</p>
      <p>Enable JavaScript to see the drawings. The <a href="./">workshop</a> needs it too.</p>
    </main>
  </noscript>
  <script type="module" src="./font-mixer.js"></script>
</body>
</html>
