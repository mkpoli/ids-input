<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cover cases and components</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--line:#e5e5ea;--accent:#1b4fb3;--ok:#0b6b3a;--subtle:#f6f6f8}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececf1;--muted:#9c9ca8;--line:#33333b;--accent:#8fb0ff;--ok:#7ee2a8;--subtle:#202026}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Noto Sans",sans-serif}
main{max-width:1400px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:21px;margin:0 0 4px}p.sub{margin:0 0 12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:inherit;cursor:pointer;font:inherit}
.tab[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
input[type=search]{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;font:inherit;width:min(360px,100%)}
.hint{color:var(--muted);font-size:12px}
svg.draw{display:block;border:1px solid var(--line);border-radius:8px;background:var(--bg)}path{fill:currentColor}
button.copy{padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;cursor:pointer;font:10px ui-monospace,monospace}
.small{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.ids{font:13px/1.45 "Noto Sans CJK TC","Noto Serif CJK TC",serif;word-break:break-all}
.cap{font-size:10px;color:var(--muted);margin-top:2px}
.glyphchar{font:32px/1.05 "Noto Serif CJK JP","Noto Serif JP",serif;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none}.toast.show{opacity:1}
#view{display:flex;flex-direction:column;gap:0}
.row{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.idx{width:40px;flex:none;font:700 17px/1 system-ui;color:var(--accent);text-align:right}
.gridwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:11px;padding:9px}
.faces{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.face{width:50px;height:62px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:24px}
details.fine{margin:0 0 12px;color:var(--muted)}details.fine summary{cursor:pointer;font-weight:600;color:var(--fg)}
.hits{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:4px}.hit{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:4px;align-items:center}.tiny{font:11px/1.3 "Noto Sans CJK TC","Noto Serif CJK TC",serif;color:var(--muted);word-break:break-all;text-align:center}
</style></head><body><main>
<h1>Cover cases and components</h1>
<p class="sub" id="sub">Loading…</p>
<div class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" data-tab="caps">Cover cases (21 + 15)</button>
  <button class="tab" role="tab" data-tab="gallery">Top-line characters (80)</button>
  <button class="tab" role="tab" data-tab="components">Components (93)</button>
</div>
<div class="bar"><input id="q" type="search" placeholder="Filter by character or IDS…"><span class="hint" id="count"></span></div>
<div id="view"></div>
<div class="toast" id="toast"></div>
</main><script>
const FACES=[{f:'Noto Serif CJK JP',n:'serif JP'},{f:'Noto Sans CJK JP',n:'sans JP'},{f:'Noto Serif CJK KR',n:'serif KR'},{f:'Noto Serif CJK TC',n:'serif TC'},{f:'FangSong',n:'FangSong'},{f:'KaiTi',n:'KaiTi'},{f:'MingLiU',n:'MingLiU'}];
let DATA=null, tab='caps';
const view=document.getElementById('view'), q=document.getElementById('q'), count=document.getElementById('count'), sub=document.getElementById('sub');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const draw=(d,size=150)=>d?`<svg class="draw" width="${size}" height="${size}" viewBox="0 0 1000 1000"><path d="${d}"/></svg>`:`<div class="draw" style="width:${size}px;height:${size}px;display:grid;place-items:center;color:#999;font-size:11px">—</div>`;
const score=v=>v==null?'—':Number(v).toFixed(3);
let tm;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('show'),1200)}
function copy(x,w){const d=()=>toast('Copied '+w);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(x).then(d,f);else f();function f(){const a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');d()}catch(e){toast('Copy failed')}a.remove()}}
function copies(ch,ids,row){return `<div class="small"><button class="copy" data-c="${esc(ch)}" data-w="glyph">Glyph</button><button class="copy" data-c="${esc(ids)}" data-w="IDS">IDS</button><button class="copy" data-c="${esc(row)}" data-w="row">Row</button></div>`}
function pick(rows){const t=q.value.trim().toLowerCase();return t?rows.filter(r=>JSON.stringify(r).toLowerCase().includes(t)):rows}
function renderCaps(){
  const d=DATA.covers;
  const rank=pick(d.rank), cases=pick(d.cases);
  view.innerHTML=[...rank.map((r,i)=>`<div class="row"><div class="idx">${i+1}</div><div class="glyphchar">${esc(r.char)}</div>
    <div style="flex:1;min-width:0"><div class="ids">${esc(r.desc)}</div>${copies(r.char,r.desc,r.char+'\t'+r.desc+'\t'+score(r.old)+'\t'+score(r.new))}</div>
    ${draw(r.truth)}${draw(r.oldD)}${draw(r.newD)}<div class="cap" style="width:80px">${score(r.old)} → ${score(r.new)}</div></div>`).join(''),'<h3 style="margin:18px 0 6px;font-size:15px">15 cases</h3>',
    ...cases.map((r)=>`<div class="row"><div class="idx">${r.n}</div><div class="glyphchar">${esc(r.char)}</div>
    <div style="flex:1;min-width:0"><div class="ids">${esc(r.desc)}</div>${copies(r.char,r.desc,r.char+'\t'+r.desc+'\t'+score(r.old)+'\t'+score(r.new))}</div>
    ${draw(r.truth)}${draw(r.oldD)}${draw(r.newD)}<div class="cap" style="width:80px">${score(r.old)} → ${score(r.new)}</div></div>`)].join('');
  count.textContent=`${rank.length + cases.length} of ${d.rank.length + d.cases.length}`;
}
function renderGallery(){
  const rows=pick(DATA.gallery);
  view.innerHTML='<div class="gridwrap">'+rows.map(r=>`<div class="card"><div style="display:flex;gap:8px;align-items:center">
    <div class="glyphchar" style="font-size:34px">${esc(r.char)}</div>
    <div style="flex:1;min-width:0"><div class="ids">${esc(r.desc)}</div><div class="cap">eaten ${r.eaten0} → ${r.eaten1}</div>${copies(r.char,r.desc,r.char+'\t'+r.desc+'\t'+r.eaten0+'\t'+r.eaten1)}</div></div>
    <div style="display:flex;gap:8px;margin-top:6px">${draw(r.glyph,120)}${draw(r.old,120)}${draw(r.cur,120)}<div class="cap">glyph · original · current</div></div></div>`).join('')+'</div>';
  count.textContent=`${rows.length} of ${DATA.gallery.length}`;
}
let compPart=null;
const APPROVED=["⿱甶儿", "⿳卝罒冖", "⿴𦥑同", "㇯鹿比", "⿰工几", "⿴囗夊", "⿱𠆢虫", "⿰氵氵", "⿻甲一", "⿳亠口冖", "㇯馬灬", "⿱⺀㐅", "⿱一血", "㇯鳥灬", "⿱皿亅", "⿳亠㐅厂", "⿱士冖", "⿻𢶶戈", "⿱丿乚", "⿸尸彳", "⿱䙲巳"];
function renderComponents(){
  const rows=pick(DATA.components);
  const fine=new Set(APPROVED);
  const bad=rows.filter(r=>!fine.has(r.ids));
  const parts=[...new Set(rows.map(r=>r.ids[0]))];
  const shown=compPart?bad.filter(r=>r.ids.startsWith(compPart)):bad;
  const chip=(v,label,active)=>`<button class="tab" style="padding:4px 10px;font-size:12px" aria-selected="${active}" data-part="${v??''}">${esc(label)}</button>`;
  const card=r=>{
    const hits=(r.held??[]).slice(0,24), family=(r.family??[]).slice(0,60);
    const faceOf=hits[0]?.ch;
    const faces=faceOf?`<div class="faces">${FACES.map(({f,n})=>`<div style="text-align:center"><div class="face" style="font-family:'${f}'">${esc(faceOf)}</div><div class="cap">${n}</div></div>`).join('')}</div>`:'';
    const list=(label,items)=>items.length?`<div class="cap" style="margin-top:8px">${label} (${items.length}):</div><div class="hits">${items.map(h=>`<div class="hit"><div style="font:24px 'Noto Serif CJK JP',serif">${esc(h.ch)}</div>${draw(h.d,56)}<div class="ids tiny">${esc(h.ids)}</div></div>`).join('')}</div>`:'';
    return `<div class="card"><div style="display:flex;gap:10px;align-items:flex-start">
      ${draw(r.cur??r.d,110)}<div style="flex:1;min-width:0"><div class="ids">${esc(r.ids)}</div>
      <div class="cap">${r.strokes} strokes · ${r.uses} uses${r.first?' · '+r.first:''}</div>${copies(r.ids,r.ids,r.ids+'\t'+r.strokes)}</div></div>
      ${list('characters holding it', hits)}
      ${list('characters under the same enclosure', family)}
      ${faces}</div>`;
  };
  view.innerHTML=`<div class="tabs" style="margin-bottom:10px">${chip(null,'All',!compPart)}${parts.map(p=>chip(p,p,compPart===p)).join('')}</div>
    <details class="fine"><summary>Approved as drawn — resolved (${rows.filter(r=>fine.has(r.ids)).length})</summary><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${rows.filter(r=>fine.has(r.ids)).map(r=>`<span class="ids">${esc(r.ids)}</span>`).join(' · ')}</div></details>
    <div class="gridwrap">${shown.map(card).join('')}</div>`;
  view.querySelectorAll('[data-part]').forEach(b=>b.addEventListener('click',()=>{compPart=b.dataset.part||null;render()}));
  count.textContent=`${shown.length} to redesign${compPart?' ('+compPart+')':''} of ${DATA.components.length}`;
}
function render(){ if(!DATA) return; if(tab==='caps') renderCaps(); else if(tab==='gallery') renderGallery(); else renderComponents();
  view.querySelectorAll('button.copy').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.c,b.dataset.w))); }
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{tab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t?'true':'false'));q.value='';render()}));
q.addEventListener('input',()=>{q.value;render()});
fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;sub.textContent='Composed with the branch rules; each row shows the real glyph, the unmodified composer, and the current drawing. Click a copy button on any item.';render()},()=>{sub.textContent='data.json failed to load'});
</script></body></html>
